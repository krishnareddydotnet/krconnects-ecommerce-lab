# customer-portal: React UI served by nginx (non-root, port 8080)

# Fixed name, so the Deployment and Service are called "customer-portal"
fullnameOverride: customer-portal

image:
  repository: ckreddy3030/customer-portal
  tag: "2b8f5eb"
  pullPolicy: IfNotPresent

service:
  type: LoadBalancer   # exposed outside the cluster (browser access)
  port: 8080           # also used as the containerPort by the chart

livenessProbe:
  httpGet:
    path: /health/live
    port: http

readinessProbe:
  httpGet:
    path: /health/ready
    port: http