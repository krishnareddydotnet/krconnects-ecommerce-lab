apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer-portal
spec:
  selector:
    matchLabels:
      app: customer-portal
  template:
    metadata:
      labels:
        app: customer-portal
    spec:
      containers:
      - name: customer-portal
        image: customer-portal:v1.0.1
        resources:
          limits:
            memory: "128Mi"
            cpu: "500m"
          requests:
            memory: "64Mi"
            cpu: "250m"
        ports:
        - containerPort: 8080

---

apiVersion: v1
kind: Service
metadata:
  name: customer-portal
spec:
  type: LoadBalancer
  selector:
    app: customer-portal
  ports:
  - port: 80
    targetPort: 8080
