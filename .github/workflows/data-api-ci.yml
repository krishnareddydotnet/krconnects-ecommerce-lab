name: data api ci

permissions: 
  contents: read

on:
  push:
    branches:
      - main
    paths:
      - 'data-api/**'
      - '.github/workflows/data-api-ci.yml'
      
  workflow_dispatch:

env:
  IMAGE_TAG: v1.0.0

jobs:

  build_dotnet:
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: ./data-api

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          

      - name: secrets scanning
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: restore packages
        run: dotnet restore

      - name: build
        run: dotnet build

      - name: test
        run: dotnet test tests/DataApi.Tests/DataApi.Tests.csproj

  build_docker:
    needs: build_dotnet

   
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: ./data-api

    steps:
      - name: checkout code
        uses: actions/checkout@v6.0.0

      - name: docker login
        uses: docker/login-action@v4
        with:
          username: ${{secrets.DOCKERHUB_USERNAME}}
          password: ${{secrets.DOCKERHUB_TOKEN}}

#      - name: docker setup
#        uses: docker/setup-docker-action@v5


      - name: generate git sha
        id: IMAGE_TAG
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT" 

      - name: docker build
        run: docker build -t ${{secrets.DOCKERHUB_USERNAME}}/data-api:${{steps.IMAGE_TAG.outputs.tag}} .

      - name: Scan container image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
         image-ref: '${{secrets.DOCKERHUB_USERNAME}}/data-api:${{steps.IMAGE_TAG.outputs.tag}}'
         format: 'table'
         exit-code: '1'
         ignore-unfixed: true
         vuln-type: 'os,library'
         severity: 'CRITICAL,HIGH'

      - name: docker push
        run: docker push ${{secrets.DOCKERHUB_USERNAME}}/data-api:${{steps.IMAGE_TAG.outputs.tag}}

      - name: Update Helm image tag
        shell: bash
        env:
          IMAGE_TAG: ${{ steps.IMAGE_TAG.outputs.tag }}
        run: |
          sed -i -E "s/^([[:space:]]*tag:).*/\1 \"$IMAGE_TAG\"/" helm/ecommerce/values-data-api.yaml
      
      - name: Commit and push Helm values
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      
          git add helm/ecommerce/values-data-api.yaml
      
          git diff --cached --quiet && exit 0
      
          git commit -m "chore: update data-api image tag"
          git push
        



        
