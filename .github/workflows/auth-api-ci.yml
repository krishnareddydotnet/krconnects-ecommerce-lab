name: auth api ci

permissions: 
  contents: read

on:
  push:
   branches:
     - main
   paths:
      - 'auth-api/**'
      - '.github/workflows/auth-api-ci.yml'
defaults:
  run:
    working-directory: ./auth-api

env:
  IMAGE_TAG: v1.0.0

jobs:
  
  build:
  
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v6

      - name: setup dotnet core
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Downloads the NuGet packages
        run: dotnet restore AuthApi.csproj

      - name: Compiles the API
        run: dotnet build AuthApi.csproj --no-restore -c Release

      - name: test
        run: dotnet test tests/AuthApi.Tests/AuthApi.Tests.csproj

      - name: docker login
        uses: docker/login-action@v4
        with:
          username: ${{secrets.DOCKERHUB_USERNAME}}
          password: ${{secrets.DOCKERHUB_TOKEN}}

      - name: docker setup
        uses: docker/setup-docker-action@v5



      - name: docker build
        run: docker build -t ${{secrets.DOCKERHUB_USERNAME}}/auth-api:${{env.IMAGE_TAG}} .

      - name: docker push
        run: docker push ${{secrets.DOCKERHUB_USERNAME}}/auth-api:${{env.IMAGE_TAG}}
        

        

        

      
  
