name: customer portal ci

permissions:
  contents: read

on:
  push:
    branches:
      - main
    paths:
      - 'customer-portal/**'
      - '.github/workflows/customer-portal-ci.yml'

env:
  IMAGE_TAG: v1.0.0
  
jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: customer-portal
        
    steps:
      - name: checkout code
        uses: actions/checkout@v6

      - name: setup node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: install dependency packages
        run: npm ci

      - name: test
        run: npm test

      - name: generate production files
        run: npm run build 

      - name: docker setup
        uses: docker/setup-docker-action@v5

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          
      - name: build docker image
        run: docker build -t ${{secrets.DOCKERHUB_USERNAME}}/customer-portal:${{env.IMAGE_TAG}} .

      - name: docker push
        run: docker push ${{secrets.DOCKERHUB_USERNAME}}/customer-portal:${{env.IMAGE_TAG}}
          
        
      
