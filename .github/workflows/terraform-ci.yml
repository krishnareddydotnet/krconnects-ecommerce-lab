name: terraform ci
on: 
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs: 
  plan:  
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - name: checkout code
        uses: actions/checkout@v6

      - name: setup terraform
        uses: hashicorp/setup-terraform@v1

      - name: terraform init
        run: terraform init
        
