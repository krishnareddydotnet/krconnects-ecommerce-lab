name: terraform ci
on: 
  push:
    branches:
      - main
    paths:
     - 'infra/terraform/**'
     - '.github/workflows/terraform-ci.yml'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs: 
  plan:  
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - name: checkout code
        uses: actions/checkout@v6

      - name: setup terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.14.6"

      - name: terraform init
        run: terraform init
        
