name: Data API Build and Test

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: ./data-api

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: restore packages
        run: dotnet restore

      - name: build
        run: dotnet build

      - name: test
        run: dotnet test

  buildimage:
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: ./data-api

    steps:
      - name: checkout code
        uses: actions/checkout@v6.0.0

      - name: docker setup
        run: docker/setup-docker-action@v5



        
