name: Data API Build and Test
on: 
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout code
        uses: actions/checkout@v6
      - name: setup dotnet
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 #v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: build
        run: |
          dotnet restore data-api\DataApi.csproj
          dotnet build DataApi\DataApi.csproj
        
