name: Data API Build and Test
on: 
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout code
        uses: actions/checkout@v6
      - name: setup dotnet
        uses: actions/dotnet-setup@v6
      - name: build
        run: |
          dotnet restore
          dotnet build
        
