name: catalog api CI

on:
  push:
    branches:
      - main
    paths:
      - 'data-api/**'
      - '.github/workflows/catalog-api-ci.yml'
      
  workflow_dispatch:

jobs:

  build_dotnet:
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: ./catalog-api

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - run: java --version

      - name: compile
        run: mvn -B compile

        #Downloads dependencies and runs 9 tests
      - name: test 
        run: mvn -B test 

        #Builds the runnable jar
      - name: test
        run: mvn -B package -DskipTests

  build_docker:
    needs: build_dotnet

   
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: ./catalog-api

    steps:
      - name: checkout code
        uses: actions/checkout@v6.0.0

      - name: docker login
        uses: docker/login-action@v4
        with:
          username: ${{secrets.DOCKERHUB_USERNAME}}
          password: ${{secrets.DOCKERHUB_TOKEN}}

      - name: docker setup
        uses: docker/setup-docker-action@v5

      - name: docker build
        run: docker build -t ${{secrets.DOCKERHUB_USERNAME}}/catalog-api:v1.0.0 .

      - name: docker push
        run: docker push ${{secrets.DOCKERHUB_USERNAME}}/catalog-api:v1.0.0



        
